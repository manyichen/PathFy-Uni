# PathFy-Uni Nginx — 前端静态文件 + /api 反代 Flask
server {
    listen 80;
    server_name _;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nuxt 静态 SPA：找不到文件时 fallback 到 /200.html
    location / {
        try_files $uri $uri/ /200.html;
    }

    # API 反代到 Flask 后端
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长任务（如 ETL）超时放宽
        proxy_read_timeout 600s;
    }

    # 后端静态资源（如有）
    location /static/ {
        proxy_pass http://backend:5000;
    }
}
